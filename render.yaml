# Render Blueprint — deploys the Streamlit demo as a free-tier web service.
# In the Render dashboard: New -> Blueprint -> select this repo.
# Python version comes from .python-version at the repo root (3.13).
services:
  - type: web
    name: pyfinlib-practice-demo
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install ".[app]"
    startCommand: streamlit run app/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    autoDeploy: true
